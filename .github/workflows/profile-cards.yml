name: Refresh profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile-cards.yml

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch public metrics and render cards
        run: python3 scripts/update_profile.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save refreshed cards
        shell: bash
        run: |
          git add assets/header.svg assets/capabilities-ai.svg assets/capabilities-geo.svg assets/capabilities-products.svg assets/github-stats.svg assets/languages.svg assets/activity.svg assets/profile-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile cards'
          git push
